<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Forja — entreno en casa</title>
<meta name="theme-color" content="#0d0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<style>
:root{
  --bg:#0d0e10; --s1:#16181c; --s2:#1e2126; --stage:#1a1d22; --line:#2b2f36;
  --tx:#f3f0ea; --mut:#9499a1; --dim:#666b73;
  --ac:#ff5a1f; --ac2:#ff8a3d; --acbg:rgba(255,90,31,.13); --ok:#8fdc7f;
  --r:22px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h3{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mut{color:var(--mut)} .small{font-size:14px}

#view{padding:calc(var(--sat) + 22px) max(20px,var(--sar)) calc(var(--sab) + 104px) max(20px,var(--sal));max-width:1120px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head .eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ac2);margin-bottom:6px}
.sec{margin-top:30px}
.sec>h3{margin-bottom:12px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:8px 8px calc(var(--sab) + 8px);background:rgba(13,14,16,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:120px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11.5px;font-weight:600;color:var(--dim);border-radius:14px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx)}
nav button.on svg{stroke:var(--ac)}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:99px;background:var(--s2);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.ac{background:var(--acbg);color:var(--ac2)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:18px;
  font-weight:800;font-size:17px;letter-spacing:-.01em;background:var(--s2);border:1px solid var(--line);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#160700}
.btn.ghost{background:none}
.btn.sm{min-height:44px;font-size:15px;padding:0 16px;border-radius:14px}
.btn svg{width:20px;height:20px;fill:currentColor}

/* figure stage */
.stage{background:var(--stage);border-radius:18px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto}
.thumb{width:84px;flex:none;border-radius:14px}

/* hero */
.hero{display:grid;gap:0;padding:0;overflow:hidden}
.hero .stage{border-radius:0;background:linear-gradient(180deg,#20242a,#181b1f)}
.hero .body{padding:20px}
.hero h2{font-size:30px;letter-spacing:-.03em;margin:10px 0 6px}
.hero .meta{display:flex;gap:18px;margin:16px 0 18px}
.hero .meta div{font-size:13px;color:var(--mut)}
.hero .meta b{display:block;font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.02em}

.week{display:flex;align-items:center;gap:14px}
.week .days{display:flex;gap:6px;flex:1}
.week .d{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--dim)}
.week .d i{display:grid;place-items:center;height:38px;border-radius:11px;background:var(--s2);margin-bottom:6px;color:var(--dim)}
.week .d i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.week .d.ok i{background:var(--ac);color:#fff}
.week .d.next i{color:var(--tx)}
.week .d.today i{outline:2px solid var(--tx);outline-offset:2px;color:var(--tx)}
.week .d.today{color:var(--tx)}
.week .goal small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.wleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--mut)}
.wleg span{display:inline-flex;align-items:center;gap:5px}
.wleg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.week .goal{text-align:right;font-size:12px;color:var(--mut);line-height:1.25}
.week .goal b{display:block;font-size:24px;color:var(--tx);font-weight:800}

.plan12{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.plan12 i{height:10px;border-radius:5px;background:var(--s2)}
.plan12 i:nth-child(4n){margin-right:5px}
.plan12 i.d{background:var(--ac)}.plan12 i.c{background:var(--tx)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;background:var(--s1);border:1px solid var(--line);border-radius:18px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.row .t span{font-size:13.5px;color:var(--mut)}
.row .q{font-weight:800;font-size:16px;white-space:nowrap;padding-right:6px}
.row .q small{display:block;text-align:right;font-size:11.5px;font-weight:600;color:var(--mut)}

.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:40px;padding:0 16px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.filters button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:block;width:100%}
.ex .stage{border-radius:0}
.ex div.t{padding:11px 13px 13px}
.ex b{display:block;font-size:15px;font-weight:700;line-height:1.2}
.ex span{font-size:12.5px;color:var(--mut)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:16px 14px}
.stat b{display:block;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat span{font-size:12.5px;color:var(--mut)}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--tx);color:var(--bg)}
.set{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.set label{font-weight:700}
.set p{font-size:13.5px;color:var(--mut)}
.field{display:flex;gap:10px}
.field input{flex:1;min-width:0;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--s2);padding:0 16px;font-size:18px;font-weight:700}
.field input:focus{outline:2px solid var(--ac);outline-offset:1px}
.hist{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border:0}
.note{font-size:14.5px;color:#c9c5bd}
.note li{margin:8px 0}
.note ul{margin:8px 0 0;padding-left:20px}
.banner{display:flex;align-items:center;gap:14px;margin-bottom:16px;background:var(--acbg);border-color:rgba(255,90,31,.4)}
.banner p{flex:1;font-size:14.5px}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:none}
.ov.on{display:block}
#sheet{z-index:50}
.sheet-in{max-width:760px;margin:0 auto;padding:calc(var(--sat) + 14px) max(20px,var(--sar)) calc(var(--sab) + 30px) max(20px,var(--sal))}
.xbtn{width:48px;height:48px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:14px;font-size:16px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ac2)}
.tipbox{display:grid;gap:10px}
.tipbox div{padding:14px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-size:15px}
.tipbox b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.tipbox .good b{color:var(--ok)} .tipbox .bad b{color:var(--ac2)}

/* player */
#player .wrap{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1100px;margin:0 auto;padding:calc(var(--sat) + 12px) max(20px,var(--sar)) calc(var(--sab) + 20px) max(20px,var(--sal));gap:14px}
.ptop{display:flex;align-items:center;gap:14px}
.pbar{flex:1;display:flex;gap:4px}
.pbar i{flex:1;height:5px;border-radius:3px;background:var(--s2)}
.pbar i.d{background:var(--ac)} .pbar i.c{background:var(--tx)}
.pmid{display:grid;gap:16px;align-content:center}
.pmid .stage{max-height:44vh}
.pmid .stage svg{max-height:44vh}
.pinfo{text-align:center}
.pinfo .ph{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ac2)}
.pinfo h2{font-size:28px;margin:6px 0 2px}
.big{font-size:92px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:10px 0 2px}
.big small{font-size:26px;letter-spacing:0;color:var(--mut);font-weight:700;margin-left:6px}
.pact{display:grid;gap:10px}
.pact .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.xl{min-height:68px;font-size:20px;border-radius:22px}
.rest .big{color:var(--ok)}
.nextup{display:flex;align-items:center;gap:12px;justify-content:center;font-size:14px;color:var(--mut)}
.done-hero{text-align:center;padding:30px 0}
.done-hero .ring{width:112px;height:112px;border-radius:50%;background:var(--acbg);display:grid;place-items:center;margin:0 auto 20px}
.done-hero .ring svg{width:52px;height:52px;fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:none;place-items:center;padding:24px}
.modal.on{display:grid}
.modal .card{max-width:380px;width:100%;background:var(--s2)}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}

.ob{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 40px) max(22px,var(--sar)) calc(var(--sab) + 30px) max(22px,var(--sal))}
.ob .logo{font-size:15px;font-weight:800;letter-spacing:.22em;color:var(--ac)}
.ob h1{margin:14px 0 10px;font-size:40px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt button{text-align:left;padding:14px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.opt button.on{border-color:var(--ac);background:var(--acbg)}
.opt b{display:block;font-size:16px}
.opt span{font-size:13.5px;color:var(--mut)}

@media (min-width:860px){
  nav{top:0;right:auto;bottom:0;width:96px;flex-direction:column;justify-content:center;gap:10px;border-top:0;border-right:1px solid var(--line);width:calc(96px + var(--sal));padding:16px 8px 16px calc(8px + var(--sal))}
  nav button{flex:none;width:100%;min-height:72px}
  #view{padding:calc(var(--sat) + 36px) max(36px,var(--sar)) 48px calc(132px + var(--sal));max-width:1280px}
  .two-col{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
  .two-col .sec:first-child{margin-top:0}
  .hero .body{padding:26px}
  .hscroll,.filters{margin-left:0;margin-right:0;padding-left:0;padding-right:0;flex-wrap:wrap}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  h1{font-size:42px}
}
@media (orientation:landscape) and (min-width:700px){
  #player .wrap{grid-template-columns:1.15fr 1fr;grid-template-rows:auto 1fr;column-gap:28px}
  .ptop{grid-column:1/-1}
  .pmid{grid-template-columns:1fr;grid-row:2}
  .pmid .stage,.pmid .stage svg{max-height:70vh}
  #player .side{display:grid;align-content:center;gap:22px;grid-row:2}
  .pmid .pinfo{display:none}
}
@media not ((orientation:landscape) and (min-width:700px)){
  #player .side .pinfo{display:none}
}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav"></nav>
<div class="ov" id="sheet"></div>
<div class="ov" id="player"></div>
<div class="ov" id="onboard"></div>
<div class="modal" id="modal"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="gVol" cx=".34" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient></defs></svg>
<script>
'use strict';
/* ================= FIGURA: esqueleto 2D con cinemática inversa ================= */
const LEN={torso:46,ua:24,fa:24,th:32,sh:32,neck:17,head:9.5,foot:9}, FLOOR=140, RAD=Math.PI/180;
const C={near:'#f1ede5',far:'#5d626a',hl:'#ff5a1f',hlFar:'#a8431c',bg:'#1a1d22',neck:'#cfcabf',prop:'#343941',propHi:'#454b55'};
const pol=(p,a,d)=>[p[0]+d*Math.cos(a*RAD),p[1]+d*Math.sin(a*RAD)];
function ik(R,T,a,b,s){
  const dx=T[0]-R[0],dy=T[1]-R[1],d=Math.hypot(dx,dy)||.001;
  const dc=Math.max(Math.abs(a-b)+.01,Math.min(a+b-.01,d)),base=Math.atan2(dy,dx);
  const al=Math.acos((a*a+dc*dc-b*b)/(2*a*dc));
  return [[R[0]+a*Math.cos(base+s*al),R[1]+a*Math.sin(base+s*al)],[R[0]+dc*Math.cos(base),R[1]+dc*Math.sin(base)]];
}
const pv=(foot,ang)=>({hip:pol(foot,ang,63.5),t:ang});          // cuerpo rígido pivotando en el pie
const mix=(a,b,u)=>Array.isArray(a)?a.map((v,i)=>v+(b[i]-v)*u):a+(b-a)*u;
function lerpPose(A,B,u,seq){const o={},uN=seq?Math.min(1,u*2):u,uF=seq?Math.max(0,u*2-1):u;for(const k in A)o[k]=(k in B)?mix(A[k],B[k],/N(p)?$/.test(k)?uN:/F(p)?$/.test(k)?uF:u):A[k];return o}
const f1=n=>Math.round(n*10)/10;
const ln=(a,b,w,c)=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const ci=(p,r,c)=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${c}"/>`;

/* segmento con volumen: cápsula afilada + sombra abajo-derecha + brillo arriba-izquierda */
function limb(a,b,w1,w2,c,k=1){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||.001;let nx=-dy/d,ny=dx/d;if(nx*.5+ny*.86<0){nx=-nx;ny=-ny}
  const r1=w1/2,r2=w2/2,wm=(w1+w2)/2,P=(p,r)=>f1(p[0]+nx*r)+','+f1(p[1]+ny*r);
  const L=(o,w,col,op)=>`<line x1="${f1(a[0]+nx*wm*o)}" y1="${f1(a[1]+ny*wm*o)}" x2="${f1(b[0]+nx*wm*o)}" y2="${f1(b[1]+ny*wm*o)}" stroke="${col}" stroke-opacity="${op}" stroke-width="${f1(wm*w)}" stroke-linecap="round"/>`;
  return `<polygon points="${P(a,r1)} ${P(b,r2)} ${P(b,-r2)} ${P(a,-r1)}" fill="${c}"/>`+ci(a,r1,c)+ci(b,r2,c)+L(.2,.4,'#000',.22*k)+L(-.2,.2,'#fff',.3*k);
}
function fig(ex,u){
  const p=lerpPose(ex.a,ex.b,u,ex.seq), hl=ex.hl||[], has=k=>hl.includes(k);
  const eb=[].concat(ex.eb??1), kb=[].concat(ex.kb??-1);
  const hip=p.hip, sho=pol(hip,p.t,LEN.torso), head=pol(sho,p.t+(p.hd||0),LEN.neck);
  const tgt=(c,pl,o)=>pl?pol(o,pl[0],pl[1]):c;
  const hN=tgt(p.hN,p.hNp,sho), hF=tgt(p.hF,p.hFp,sho)||hN, fN=tgt(p.fN,p.fNp,hip), fF=tgt(p.fF,p.fFp,hip)||fN;
  const [eN,hn]=ik(sho,hN,LEN.ua,LEN.fa,eb[0]), [eF,hf]=ik(sho,hF,LEN.ua,LEN.fa,eb[1]??eb[0]);
  const [kN,fn]=ik(hip,fN,LEN.th,LEN.sh,kb[0]), [kF,ff]=ik(hip,fF,LEN.th,LEN.sh,kb[1]??kb[0]);
  const toeN=p.toeN||0, toeF=p.toeF??toeN;
  let s='';
  // suelo y objetos
  s+=`<line x1="6" y1="${FLOOR}" x2="214" y2="${FLOOR}" stroke="${C.prop}" stroke-width="2" stroke-linecap="round"/>`;
  const pr=ex.props||{};
  if(pr.wall!=null) s+=`<rect x="${pr.wall}" y="-30" width="9" height="${FLOOR+30}" rx="2" fill="${C.prop}"/>`;
  if(pr.chair){const c=pr.chair;
    s+=ln([c.x+4,c.y+4],[c.x+4,FLOOR-2],4,C.prop)+ln([c.x+c.w-4,c.y+4],[c.x+c.w-4,FLOOR-2],4,C.prop);
    if(c.back) {const bx=c.back==='l'?c.x+3:c.x+c.w-3; s+=ln([bx,c.y],[bx,c.y-40],5,C.prop);}
    s+=`<rect x="${c.x}" y="${c.y}" width="${c.w}" height="6" rx="3" fill="${C.propHi}"/>`;}
  const pack=(h)=>{const dy=pr.pack;return `<rect x="${f1(h[0]-10)}" y="${f1(h[1]+dy-12)}" width="20" height="24" rx="6" fill="${C.propHi}" stroke="${C.bg}" stroke-width="2"/><rect x="${f1(h[0]-5)}" y="${f1(h[1]+dy+1)}" width="10" height="6" rx="2" fill="${C.prop}"/>`};
  // sombra en el suelo
  {const xs=[hip[0],sho[0],head[0],fn[0],ff[0]],x0=Math.min(...xs),x1=Math.max(...xs);
   s+=`<ellipse cx="${f1((x0+x1)/2)}" cy="${FLOOR+1.5}" rx="${f1((x1-x0)/2+12)}" ry="3.6" fill="#000" opacity=".3"/>`;}
  const G=(p,r)=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="url(#gVol)"/>`;
  // lado lejano
  s+=limb(sho,eF,9,7.5,has('arms')||has('shoulders')?C.hlFar:C.far,.5)+limb(eF,hf,7.5,6,C.far,.5)+ci(hf,4.2,C.far);

    if(d>=2){if(LOADED[id]&&raiseLoad(id)){S.lc[id]=0;out.push(`${EX[id].name.toLowerCase()}: ${loadTxt(id).replace(/^./,c=>c.toLowerCase())}`);return}
      const add=Math.min(4,d,capOf(id)-it[2]);if(add>0){S.xb[id]=(S.xb[id]||0)+add;out.push(`${EX[id].name.toLowerCase()}: +${add} rep`)}}
    else if(d<=-3)S.xb[id]=Math.max(-4,(S.xb[id]||0)-2)});
  return out}
function kRate(v){const a=S.kAdj||0;
  if(v==='F'){S.kAdj=Math.min(5,a+5);P.kmsg=a>=5?'Ya vas 5 minutos por encima del plan. La intensidad sigue subiendo sola con las semanas.':'Te subo 5 minutos el próximo cardio.'}
  else if(v==='D'){S.kAdj=Math.max(-5,a-5);P.kmsg='El próximo cardio será 5 minutos más corto. Ve a un ritmo en el que puedas hablar: no hace falta ahogarse para quemar grasa.'}
  else P.kmsg='Ese es el ritmo justo. Seguimos según el plan.';
  P.sub=null;save();renderDone()}
function applyRate(rate,silent){const s=S.sessions[S.sessions.length-1];s.rate=rate;if(P)P.sub=null;
  if(S.sessions.filter(x=>x.d===s.d).length===1){S.ws.push(rate);S.ease=rate==='D';
    if(S.ws.length>=need()){const o=outcome();
      if(o==='adv'&&gateDue()){if(silent){save();return}P.sub='gate';save();
        $('#player').innerHTML=`<div class="wrap" style="grid-template-rows:1fr;grid-template-columns:1fr"><div style="align-self:center;max-width:520px;width:100%;margin:0 auto"><div class="pinfo"><div class="ph">Test de flexiones</div><h1 style="margin:8px 0 10px">¿Te salen 10 clásicas?</h1><p class="mut" style="margin-bottom:22px">Hazlo descansado, no ahora: seguidas, cuerpo recto y bajando el pecho hasta casi el suelo. Con 10 abrimos la fase Forja. No llegar todavía es lo normal.</p></div>
        <div class="opt"><button data-act="gate" data-v="1" style="padding:18px"><b style="font-size:19px">Sí, 10 o más</b><span>Paso a flexiones clásicas</span></button><button data-act="gate" data-v="0" style="padding:18px"><b style="font-size:19px">Todavía no</b><span>Sigo sumando en Base y me lo preguntas la semana que viene</span></button></div></div></div>`;return}
      closeWeek(o,false)}}
  const up=loadProgress(s.ld||[],rate);
  if(up.length)S.note=(S.note?S.note+' ':'')+'Sube la carga: '+up.map(id=>`${EX[id].name.toLowerCase()}, ${loadTxt(id).replace(/^./,c=>c.toLowerCase())}`).join('; ')+'. Las repeticiones siguen igual: con más peso, cuestan más.';
  save();if(!silent)renderDone()}
function renderDone(){const brk=P.k==='P',cd=P.k==='K',w=weekInfo();
  $('#player').innerHTML=`<div class="wrap" style="grid-template-rows:1fr auto;grid-template-columns:1fr"><div class="done-hero" style="align-self:center"><div class="ring"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <div class="pinfo"><div class="ph">${brk?'Pausa hecha':cd?'Cardio hecho':'Entreno completado'}</div></div><h1 style="margin:8px 0 22px">${RT[P.k].name}</h1>
    <div class="stats" style="max-width:420px;margin:0 auto"><div class="card stat"><b class="num">${P.dur}</b><span>minutos</span></div><div class="card stat"><b class="num">${P.sets}</b><span>${cd?'bloques':'series'}</span></div><div class="card stat"><b class="num">${brk?breaksToday():w.count+'/'+goalN()}</b><span>${brk?'pausas hoy':'esta semana'}</span></div></div>
    <p class="mut" style="margin:22px auto 0;max-width:30em">${brk?'Vuelve al trabajo con la espalda recta y repítela en un par de horas.':cd?`${P.kmsg?`<b style="color:var(--tx)">${P.kmsg}</b><br><br>`:''}Esto cuenta como tu caminata de hoy. Próxima sesión de fuerza ${nextDay()}: <b style="color:var(--tx)">${RT[curKey()].name}</b>.`:(P.adj&&P.adj.length?`<b style="color:var(--ac)">Te subo: ${P.adj.join('; ')}.</b><br><br>`:'')+(S.note?`<b style="color:var(--tx)">${S.note}</b><br><br>`:'')+`Próxima sesión ${nextDay()}: <b style="color:var(--tx)">${RT[curKey()].name}</b>. Los días libres, solo pausas activas.`}</p></div>
    <button class="btn pri xl" data-act="closePlayer">Listo</button></div>`}
function renderPlayer(){
  const it=P.items[P.i],e=EX[it[0]],total=P.items.reduce((t,i)=>t+i[1],0),done=P.items.slice(0,P.i).reduce((t,i)=>t+i[1],0)+P.set-1;
  const bar=Array.from({length:total},(_,i)=>`<i class="${i<done?'d':i===done&&P.phase!=='rest'?'c':''}"></i>`).join('');
  const rest=P.phase==='rest',ready=P.phase==='ready';
  const label=rest?'Descanso':ready?'Prepárate':`Serie ${P.set} de ${it[1]}`;
  const big=rest?`<div class="big num ptime">${fmt(P.rest)}</div>`:ready?`<div class="big num ptime">5</div>`:e.timed?`<div class="big num ptime">${fmt(it[2])}</div>`:`<div class="big num">${it[2]}<small>${e.side?'por lado':'reps'}</small></div>`;
  const info=`<div class="pinfo ${rest?'rest':''}"><div class="ph">${label}</div><h2>${rest?'Siguiente: ':''}${e.name}</h2>${big}
    <p class="mut">${LOADED[it[0]]?`<b style="color:var(--ac)">${loadTxt(it[0])}</b> · `:''}${rest?`Serie ${P.set} de ${it[1]} · ${qty(it)}`:note(it[0])}</p></div>`;
  let act;
  if(rest)act=`<div class="two"><button class="btn xl" data-act="plus">+15 s</button><button class="btn pri xl" data-act="skipRest">Seguir</button></div><button class="btn ghost sm" data-act="ex" data-v="${it[0]}" style="color:var(--mut)">Ver técnica del siguiente</button>`;
  else if(e.timed)act=`<div class="two"><button class="btn xl" data-act="pause" id="pauseBtn">Pausa</button><button class="btn xl" data-act="doneSet">Saltar</button></div><div class="two"><button class="btn ghost sm" data-act="ex" data-v="${it[0]}" style="color:var(--mut)">Ver técnica</button><button class="btn ghost sm" data-act="skipEx" style="color:var(--mut)">Me duele · saltar</button></div>`;
  else act=`<div class="two" style="grid-template-columns:64px 1fr 64px;align-items:center"><button class="btn xl" data-act="rep" data-v="-1" aria-label="Una menos">−</button><div style="text-align:center"><b class="num" id="gotN" style="font-size:30px">${P.cur}</b><div class="small mut">hice</div></div><button class="btn xl" data-act="rep" data-v="1" aria-label="Una más">+</button></div><button class="btn pri xl" data-act="doneSet">Serie hecha</button><div class="two"><button class="btn ghost sm" data-act="ex" data-v="${it[0]}" style="color:var(--mut)">Ver técnica</button><button class="btn ghost sm" data-act="skipEx" style="color:var(--mut)">Me duele · saltar</button></div>`;
  $('#player').innerHTML=`<div class="wrap"><div class="ptop"><button class="xbtn" data-act="quit" aria-label="Salir del entreno">✕</button><div class="pbar">${bar}</div><span class="small mut num">${P.i+1}/${P.items.length}</span></div>
    <div class="pmid">${stage(it[0],true)}${info}</div>
    <div class="side">${info}<div class="pact">${act}</div></div></div>`;
  mountAnims()}
function closePlayer(){clearInterval(tick);lock(false);if(P&&P.sub==='krate')P.sub=null;if(P&&P.sub==='rate')applyRate('B',true);else if(P&&P.sub==='gate'){closeWeek('adv',false);save()}P=null;$('#player').classList.remove('on');$('#player').innerHTML='';if(UPD)return location.reload();render()}

/* ================= ANIMACIÓN ================= */
let anims=[];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease=x=>x*x*(3-2*x);
function wave(p){return p<.38?ease(p/.38):p<.5?1:p<.88?1-ease((p-.5)/.38):0}
let raf=0;
function mountAnims(){const top=$('#sheet').classList.contains('on')?$('#sheet'):$('#player').classList.contains('on')?$('#player'):$('#view');anims=[...top.querySelectorAll('svg[data-anim]')];if(anims.length&&!raf)raf=requestAnimationFrame(frame)}
function frame(ts){for(const el of anims){if(!el.isConnected||!el.getClientRects().length)continue;const ex=EX[el.dataset.anim],per=(ex.period||2.6)*1000*(reduce?2:1);
  let u=wave((ts%per)/per);if(reduce)u=u>.5?1:0;if(el._u===u)continue;el._u=u;el.innerHTML=fig(ex,u)}raf=anims.length?requestAnimationFrame(frame):0}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P&&P.phase!=='done'){lock(true);if(actx&&actx.state!=='running')actx.resume().catch(()=>{})}});

/* ================= EVENTOS ================= */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  const cast=x=>x==='true'?true:x==='false'?false:isNaN(+x)?x:+x;
  if(actx&&actx.state!=='running')actx.resume().catch(()=>{});
  if(P&&P.lockUntil>Date.now()&&['doneSet','skipRest','plus','pause','skipEx'].includes(a))return;
  switch(a){
    case 'tab':tab=v;dayEdit=null;render();scrollTo(0,0);break;
    case 'filt':filt=v;render();break;
    case 'ex':openEx(v);break;
    case 'closeSheet':history.back();break;
    case 'set':S[b.dataset.k]=cast(v);if(b.dataset.k==='days')S.plan=null;save();render();break;
    case 'break':startWorkout('P');break;
    case 'cardio':startWorkout('K');break;
    case 'rate':applyRate(v,false);break;
    case 'krate':kRate(v);break;
    case 'gate':{closeWeek('adv',v==='1');const s=S.sessions[S.sessions.length-1],up=loadProgress(s.ld||[],s.rate||'B');if(up.length)S.note+=' Sube la carga: '+up.map(id=>`${EX[id].name.toLowerCase()}, ${loadTxt(id).replace(/^./,c=>c.toLowerCase())}`).join('; ')+'.';P.sub=null;save();renderDone()}break;
    case 'noteOk':S.note='';save();render();break;
    case 'swap':if(S.swap[v])delete S.swap[v];else S.swap[v]=true;save();openEx(v);if(!P)render();break;
    case 'ob':OB[b.dataset.k]=cast(v);{const kg=$('#obKg').value;renderOb();$('#obKg').value=kg}break;
    case 'obGo':{const kg=parseFloat($('#obKg').value);S.pw=1;S.note='Empezamos de cero y a propósito suave. Hoy no se trata de sufrir: se trata de volver la próxima vez. Hazte hoy una foto y mídete la cintura: las compararás en la semana 12.';S.days=OB.days;S.when=OB.when;S.plan=null;S.since=dkey();S.setup=true;if(kg>=30&&kg<=250)S.weights.push({d:dkey(),kg:Math.round(kg*10)/10});save();$('#onboard').classList.remove('on');render()}break;
    case 'start':startWorkout();break;
    case 'doneSet':if(P.phase==='work'&&!EX[P.items[P.i][0]].timed)(P.got=P.got||{})[P.i]=P.cur;finishSet();break;
    case 'rep':P.cur=Math.max(0,Math.min(60,P.cur+(+v)));document.querySelectorAll('#gotN').forEach(e=>e.textContent=P.cur);break;
    case 'skipEx':(P.skipped=P.skipped||[]).push(P.items[P.i][0]);P.set=P.items[P.i][1];finishSet();break;
    case 'skipRest':afterRest();break;
    case 'plus':P.end+=15000;onTick();break;
    case 'pause':if(P.paused){P.end=Date.now()+P.left;P.paused=false;b.textContent='Pausa'}else{P.left=P.end-Date.now();P.paused=true;b.textContent='Continuar'}break;
    case 'quit':ask('¿Salir del entreno?','Esta sesión no se guardará.','Salir',()=>{P.phase='done';history.back()});break;
    case 'closePlayer':history.back();break;
    case 'reset':ask('¿Borrar todo?',AU?'Se eliminan sesiones, pesos y ajustes de este dispositivo y de tu cuenta en la nube.':'Se eliminan sesiones, pesos y ajustes de este dispositivo.','Borrar',async()=>{clearTimeout(pushT);if(AU){try{await api('/rest/v1/forja_state?user_id=eq.'+AU.uid,{method:'DELETE'})}catch(e){syncMsg='No pude borrar la copia de la nube (sin conexión). Vuelve a intentarlo con internet.';render();return}}try{localStorage.removeItem(KEY)}catch(e){}S=fresh();tab='hoy';filt='todos';boot()});break;
    case 'login':b.disabled=true;login().then(ok=>{if(!ok){S.setup?render():renderOb()}});break;
    case 'code':pasteCode($('#codeIn').value);break;
    case 'logout':ask('¿Cerrar sesión?','Tus datos se quedan en este dispositivo, pero dejan de guardarse en la nube.','Cerrar sesión',()=>{logout();render()});break;
    case 'syncNow':syncMsg='';sync().then(()=>render());break;
    case 'mNo':$('#modal').classList.remove('on');break;
    case 'mYes':$('#modal').classList.remove('on');modalYes&&modalYes();break;
  }});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;
  if(f.dataset.form==='cintura'){const cm=parseFloat(f.cm.value);if(!(cm>=50&&cm<=200))return;const W=S.waist=S.waist||[],r={d:dkey(),cm:Math.round(cm*2)/2},i=W.findIndex(w=>w.d===r.d);if(i>=0)W[i]=r;else W.push(r);save();render();return}
  if(f.dataset.form==='peso'){const kg=parseFloat(f.kg.value);if(!(kg>=30&&kg<=250))return;
  const r={d:dkey(),kg:Math.round(kg*10)/10},i=S.weights.findIndex(w=>w.d===r.d);if(i>=0)S.weights[i]=r;else S.weights.push(r);save();render()}});

addEventListener('popstate',()=>{if($('#modal').classList.contains('on'))$('#modal').classList.remove('on');
  if($('#sheet').classList.contains('on')){$('#sheet').classList.remove('on');$('#sheet').innerHTML='';mountAnims();return}
  if(P){if(P.phase==='done')closePlayer();else{history.pushState({ov:1},'');ask('¿Salir del entreno?','Esta sesión no se guardará.','Salir',()=>{P.phase='done';history.back()})}}});
setInterval(()=>{const c=$('#clock');if(c)c.textContent=nowTxt()},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!P&&S.setup&&!$('#sheet').classList.contains('on')){checkGap();render()}if(document.visibilityState==='visible'){if(!AU){AU=readAuth();if(AU&&!P&&tab==='perfil')render()}sync()}});
addEventListener('online',()=>{if(AU)sync()});
/* sin zoom: ni pellizco ni doble toque (iOS ignora user-scalable) */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
{let lt=0,sx=0,sy=0;
 document.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
 document.addEventListener('touchend',e=>{const n=Date.now(),c=e.changedTouches[0],still=c&&Math.abs(c.clientX-sx)<10&&Math.abs(c.clientY-sy)<10;
  if(still&&n-lt<400&&e.touches.length===0&&!e.target.closest('input')){e.preventDefault();const b=e.target.closest('[data-act]');if(b)b.click()}
  lt=n},{passive:false});}
function boot(){const ls=S.sessions[S.sessions.length-1];if(S.setup&&ls&&ls.rate===null)applyRate('B',true);if(S.setup)checkGap();if(!S.setup){OB={level:1,days:3,when:'am'};renderOb();$('#onboard').classList.add('on')}render()}
authReturn().then(()=>{if(HANDOFF)return handoff(HANDOFF);boot();sync()});
addEventListener('hashchange',()=>{if(/access_token=|error=/.test(location.hash))location.reload()});
/* actualización automática: busca versión nueva al volver a la app y recarga sola (nunca a mitad de un entreno) */
let SWREG=null,UPD=false;
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{SWREG=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;if(P&&P.phase!=='done')UPD=true;else location.reload()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SWREG&&navigator.onLine)SWREG.update().catch(()=>{})});
}
</script>
</body>
